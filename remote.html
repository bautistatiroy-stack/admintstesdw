    <script>
        function back() {
            window.location.href = "index.html";
        }
        const op_cl = "https://script.google.com/macros/s/AKfycbzlAMKtpzu5FnAdZfVl9e2AJMsVlQH5PA9V841Lz6nAySaPUq1RC_LV8CxyKdC2PZUC/exec";

        function openShop() {
            fetch(op_cl, {
                method: "POST",
                body: new URLSearchParams({
                    action: "shop",
                    value: "true"
                })
            }).then(() => {
                alert("Shop is OPEN 🟢");
            });
        }

        function closeShop() {
            fetch(op_cl, {
                method: "POST",
                body: new URLSearchParams({
                    action: "shop",
                    value: "false"
                })
            }).then(() => {
                alert("Shop is CLOSED 🔴");
            });
        }
    </script>

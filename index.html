
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>


    <!-- FACE API -->

    <script
        src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #6c036f;

            font-family: Arial, sans-serif;

        }


        .login-box {

            width: min(500px, 94%);

            padding: 40px;

            background: #e7cce8;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, .25);

            text-align: center;

        }


        .logo {

            width: 80px;

            height: 120px;

            object-fit: contain;

            margin-bottom: 15px;

            border-radius: 50%;

        }


        h2 {

            color: #8200a3;

            margin-bottom: 20px;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

        }


        input:focus {

            border-color: #8200a3;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #8200a3;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #650080;

        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        #error {

            color: #d00000;

            margin-top: 12px;

            font-size: 14px;

        }


        #status {

            color: #8200a3;

            margin-top: 12px;

            font-size: 14px;

            font-weight: bold;

        }


        /* CAMERA */

        #cameraBox {

            display: none;

            margin-top: 20px;

        }


        video {

            width: 100%;

            max-width: 400px;

            border-radius: 14px;

            background: #111;

        }


        canvas {

            display: none;

        }


        #preview {

            width: 100%;

            max-width: 400px;

            border-radius: 14px;

            display: none;

            margin-top: 10px;

        }


        .camera-title {

            color: #8200a3;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .camera-info {

            color: #555;

            font-size: 13px;

            margin-bottom: 12px;

        }


        #captureButton {

            margin-top: 12px;

        }


        /* LOADING */

        #loading {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, .65);

            color: white;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 15px;

            z-index: 9999;

        }


        .loader {

            width: 45px;

            height: 45px;

            border: 5px solid
                rgba(255,255,255,.3);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* LOGO ZOOM */

        .logo.zoom {

            position: fixed;

            left: 50%;

            top: 50%;

            width: 100px;

            height: 150px;

            margin: 0;

            z-index: 99999;

            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(1);

            animation:
                logoZoom 1.2s
                cubic-bezier(.65,0,.35,1)
                forwards;

        }


        @keyframes logoZoom {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

                opacity: 1;

            }

            20% {

                transform:
                    translate(-50%, -50%)
                    scale(3);

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(10);

            }

            70% {

                transform:
                    translate(-50%, -50%)
                    scale(35);

            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(35);

                opacity: 0;

            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <img
        src="logo.png"
        id="logo"
        class="logo"
        alt="Logo"
    >


    <h2>
        Admin Login
    </h2>


    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <div id="cameraBox">

        <div class="camera-title">
            Face Verification
        </div>


        <div class="camera-info">

            Allow camera access and
            position your face inside the camera.

        </div>


        <video
            id="video"
            autoplay
            playsinline>
        </video>


        <canvas
            id="canvas">
        </canvas>


        <img
            id="preview"
            alt="Captured verification photo"
        >


        <button
            type="button"
            id="captureButton"
            onclick="captureAndVerify()">

            📷 Capture & Verify

        </button>

    </div>


    <br>


    <button
        id="loginButton"
        onclick="checkCredentials()">

        Login

    </button>


    <p id="status"></p>

    <p id="error"></p>


</div>


<!-- LOADING -->

<div id="loading">

    <div class="loader"></div>

    <div id="loadingText">
        Processing...
    </div>

</div>


<script>


/*
========================================================
CONFIGURATION
========================================================
*/


const API_URL =
    "https://script.google.com/macros/s/AKfycbxCxczReCN5NtKXSY-_zq6HRW_RXEA1IM_if1nEBAai5dMpOsoTkNdUEMBG35BnsmE4EA/exec";


/*
========================================================
FACE MODELS
========================================================
*/


const MODEL_URL =
    "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


let modelsLoaded = false;

let cameraStream = null;

let capturedPhoto = null;


/*
========================================================
LOAD FACE MODELS
========================================================
*/


async function loadModels() {

    setStatus(
        "Loading face verification system..."
    );


    try {

        await Promise.all([

            faceapi.nets.tinyFaceDetector
                .loadFromUri(MODEL_URL),

            faceapi.nets.faceLandmark68TinyNet
                .loadFromUri(MODEL_URL),

            faceapi.nets.faceRecognitionNet
                .loadFromUri(MODEL_URL)

        ]);


        modelsLoaded = true;


        setStatus(
            "Face verification system ready."
        );

    }

    catch (error) {

        console.error(error);

        setError(
            "Unable to load face verification models."
        );

    }

}


/*
========================================================
CHECK CREDENTIALS
========================================================
*/


async function checkCredentials() {


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    clearMessages();


    if (!username) {

        setError(
            "Please enter your username."
        );

        return;

    }


    if (!password) {

        setError(
            "Please enter your password."
        );

        return;

    }


    if (!modelsLoaded) {

        setError(
            "Face verification is still loading."
        );

        return;

    }


    const loginButton =
        document
            .getElementById("loginButton");


    loginButton.disabled = true;

    loginButton.textContent =
        "Checking...";


    try {


        const response =
            await fetch(API_URL, {

                method: "POST",

                body: JSON.stringify({

                    action:
                        "checkLogin",

                    username:
                        username,

                    password:
                        password

                })

            });


        const result =
            await response.json();


        /*
        ---------------------------------------------
        PASSWORD INVALID
        ---------------------------------------------
        */

        if (!result.success) {

            if (
                result.needsRegistration
            ) {

                setError(
                    "No registered face found for this account."
                );

            }

            else {

                setError(
                    result.message ||
                    "Invalid username or password."
                );

            }


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

            return;

        }


        /*
        ---------------------------------------------
        PASSWORD CORRECT
        ---------------------------------------------
        */

        setStatus(
            "Password verified. Opening camera..."
        );


        document
            .getElementById("cameraBox")
            .style.display = "block";


        await startCamera();


        loginButton.style.display =
            "none";


    }

    catch (error) {

        console.error(error);

        setError(
            "Unable to connect to the server."
        );


        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }

}


/*
========================================================
START CAMERA
========================================================
*/


async function startCamera() {

    try {

        cameraStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        }

                    },

                    audio: false

                });


        const video =
            document
                .getElementById("video");


        video.srcObject =
            cameraStream;


        await video.play();


        setStatus(
            "Camera ready. Position your face and capture."
        );

    }

    catch (error) {

        console.error(error);

        setError(
            "Camera permission is required."
        );

    }

}


/*
========================================================
CAPTURE + VERIFY
========================================================
*/


async function captureAndVerify() {


    clearMessages();


    const video =
        document
            .getElementById("video");


    const canvas =
        document
            .getElementById("canvas");


    const captureButton =
        document
            .getElementById("captureButton");


    /*
    ---------------------------------------------
    MAKE SURE VIDEO IS READY
    ---------------------------------------------
    */

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        setError(
            "Camera is not ready yet."
        );

        return;

    }


    captureButton.disabled =
        true;


    showLoading(
        "Detecting your face..."
    );


    try {


        /*
        -----------------------------------------
        CAPTURE IMAGE
        -----------------------------------------
        */

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const context =
            canvas.getContext("2d");


        context.drawImage(

            video,

            0,

            0,

            canvas.width,

            canvas.height

        );


        /*
        -----------------------------------------
        PHOTO PREVIEW
        -----------------------------------------
        */

        capturedPhoto =
            canvas.toDataURL(
                "image/jpeg",
                0.80
            );


        document
            .getElementById("preview")
            .src =
            capturedPhoto;


        document
            .getElementById("preview")
            .style.display =
            "block";


        /*
        -----------------------------------------
        DETECT FACE
        -----------------------------------------
        */

        showLoading(
            "Analyzing face..."
        );


        const detection =
            await faceapi
                .detectSingleFace(

                    canvas,

                    new faceapi
                        .TinyFaceDetectorOptions({

                            inputSize: 320,

                            scoreThreshold: 0.5

                        })

                )
                .withFaceLandmarks(
                    true
                )
                .withFaceDescriptor();


        /*
        -----------------------------------------
        NO FACE
        -----------------------------------------
        */

        if (!detection) {

            hideLoading();

            setError(
                "No face detected. Please try again."
            );

            captureButton.disabled =
                false;

            return;

        }


        /*
        -----------------------------------------
        CHECK FACE SIZE
        -----------------------------------------
        */

        const box =
            detection.detection.box;


        const faceRatio =
            box.width /
            canvas.width;


        if (faceRatio < 0.18) {

            hideLoading();

            setError(
                "Move closer to the camera."
            );

            captureButton.disabled =
                false;

            return;

        }


        /*
        -----------------------------------------
        DESCRIPTOR
        -----------------------------------------
        */

        const descriptor =
            Array.from(
                detection.descriptor
            );


        /*
        -----------------------------------------
        SEND TO APPS SCRIPT
        -----------------------------------------
        */

        showLoading(
            "Verifying your identity..."
        );


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const response =
            await fetch(API_URL, {

                method: "POST",

                body: JSON.stringify({

                    action:
                        "verifyFace",

                    username:
                        username,

                    password:
                        password,

                    descriptor:
                        descriptor,

                    photo:
                        capturedPhoto

                })

            });


        const result =
            await response.json();


        /*
        -----------------------------------------
        SUCCESS
        -----------------------------------------
        */

        if (result.success) {


            stopCamera();


            sessionStorage.setItem(
                "adminLogin",
                "true"
            );


            sessionStorage.setItem(
                "token",
                result.token
            );


            sessionStorage.setItem(
                "username",
                username
            );


            hideLoading();


            setStatus(
                "✓ Identity verified. Redirecting..."
            );


            /*
            LOGO ANIMATION
            */

            document
                .getElementById("logo")
                .classList
                .add("zoom");


            setTimeout(() => {

                window.location.href =
                    "index2.html";

            }, 1200);


            return;

        }


        /*
        -----------------------------------------
        FAILED
        -----------------------------------------
        */

        hideLoading();


        setError(
            result.message ||
            "Face verification failed."
        );


        if (
            typeof result.distance ===
            "number"
        ) {

            setStatus(
                "Face distance: " +
                result.distance.toFixed(3)
            );

        }


        captureButton.disabled =
            false;

    }

    catch (error) {

        console.error(error);

        hideLoading();

        setError(
            "Face verification failed. Please try again."
        );

        captureButton.disabled =
            false;

    }

}


/*
========================================================
STOP CAMERA
========================================================
*/


function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        cameraStream =
            null;

    }

}


/*
========================================================
UI HELPERS
========================================================
*/


function setError(message) {

    document
        .getElementById("error")
        .textContent =
        message;

}


function setStatus(message) {

    document
        .getElementById("status")
        .textContent =
        message;

}


function clearMessages() {

    setError("");

    setStatus("");

}


function showLoading(message) {

    document
        .getElementById("loading")
        .style.display =
        "flex";


    document
        .getElementById("loadingText")
        .textContent =
        message;

}


function hideLoading() {

    document
        .getElementById("loading")
        .style.display =
        "none";

}


/*
========================================================
ENTER KEY
========================================================
*/


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                checkCredentials();

            }

        }
    );


/*
========================================================
PAGE LOAD
========================================================
*/


window.addEventListener(
    "load",
    loadModels
);


/*
========================================================
CLEAN CAMERA
========================================================
*/


window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>


</body>

</html>
```
